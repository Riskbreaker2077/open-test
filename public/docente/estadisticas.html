<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenTest — Estadísticas</title>
  <link rel="stylesheet" href="/shared/base.css">
</head>
<body class="superficie-docente">
  <header class="barra">
    <a class="marca marca--compacta" href="/docente/"><span class="marca__logo"><img src="/assets/logo-institucional.png" alt=""></span><span class="marca__texto"><strong>OpenTest</strong><small>Estadísticas</small></span></a>
    <div class="barra__acciones"><a class="boton boton--volver boton--pequeno" href="/docente/">← Volver al panel</a><button class="boton boton--secundario boton--pequeno" id="salir">Cerrar sesión</button></div>
  </header>
  <main class="contenedor">
    <p class="sobretitulo">Revisar el banco</p>
    <h1>Estadísticas por pregunta y por competencia</h1>
    <section class="tarjeta" id="sin-bancos" hidden>
      <p>Todavía no hay bancos de preguntas cargados.</p>
    </section>
    <section class="tarjeta" id="panel" hidden>
      <label class="campo"><span>Banco</span><select id="banco"></select></label>
      <label class="campo"><span>Alcance</span><select id="alcance"></select></label>
      <label class="campo"><span>Curso</span><select id="curso"></select></label>
      <p class="apunte" id="sin-sesiones" hidden>Este banco todavía no tiene ninguna evaluación cerrada.</p>
      <div id="tablas" hidden>
        <h2>Por competencia</h2>
        <table class="tabla" id="tabla-competencias"></table>
        <h2>Por pregunta</h2>
        <p class="apunte">De menor a mayor % de acierto: lo más fallado primero.</p>
        <table class="tabla" id="tabla-preguntas"></table>
      </div>
    </section>
  </main>
  <script type="module" src="/docente/estadisticas.js"></script>
</body>
</html>
